settings:
  namespace_roots:
    code/src: Src
    code/tests: Tests
  source_extension: ".ts"
  test_suffix: ".test"
  test_extension: ".ts"
  namespace_separator: "."

coverage_xml: .parity/per-test
min_coverage: 70
min_coverage_global: 80
min_matched_coverage: 40

test:
  command: "cd code && ./node_modules/.bin/vitest run {test_abs} --coverage --coverage.all=false --coverage.reportsDirectory=$(dirname {coverage}) --coverage.reporter=clover"
  coverage: ".parity/tmp/{slug}/clover.xml"
  reports: ".parity/per-test"
  timeout: 300

structure:
  - name: "Vitest sample"
    paths:
      source: "code/src"
      test: "code/tests"
    rules:
      - minimum-coverage:
          min: 70
      - matched-coverage:
          min: 40
